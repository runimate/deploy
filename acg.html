<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>RUNIMATE - ACG Edition</title>
  
  <style>
    /* =========================================
       [CSS] Base & Fonts
       ========================================= */
    @font-face {
      font-family: 'Helv';
      src: url('./helv.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-color: #ffffff;
      --font-color: #FF7034; /* 이미지의 기본 오렌지 컬러 */
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f8f8f8;
      color: #000;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px;
      background: #fff;
      min-height: 100vh;
      box-sizing: border-box;
      padding-bottom: 120px;
    }

    .header { margin-bottom: 30px; }
    .title { font-size: 24px; font-weight: 900; text-decoration: none; color: #000; letter-spacing: -0.5px; }

    .section { margin-bottom: 32px; }
    .section-label { display: block; font-size: 11px; font-weight: 800; color: #666; margin-bottom: 12px; letter-spacing: 0.5px; }

    /* Buttons & Toggles */
    .button-group { display: flex; gap: 8px; width: 100%; }
    .toggle-btn {
      flex: 1; height: 48px; background: #f4f4f4; border: 2px solid transparent; border-radius: 12px;
      font-size: 14px; font-weight: 700; color: #999; cursor: pointer; transition: all 0.2s;
    }
    .toggle-btn.active { background: #fff; border-color: #000; color: #000; }
    
    /* Inputs */
    .input-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .input-col { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .input-label { font-size: 11px; font-weight: 800; color: #666; }
    .big-input {
      width: 100%; height: 52px; background: #f4f4f4; border: 2px solid transparent; border-radius: 12px;
      font-size: 20px; font-weight: 800; color: #000; padding: 0 16px; box-sizing: border-box; outline: none; text-align: center;
    }
    .big-input:focus { background: #fff; border-color: #000; }
    .time-wrapper { display: flex; align-items: center; gap: 4px; }
    .time-colon { font-size: 20px; font-weight: 900; margin-top: -2px; }

    /* Color Pickers */
    .color-picker-wrap { display: flex; gap: 12px; align-items: center; }
    .native-color-input {
      width: 48px; height: 48px; padding: 0; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; overflow: hidden;
    }
    .native-color-input::-webkit-color-swatch-wrapper { padding: 0; }
    .native-color-input::-webkit-color-swatch { border: none; border-radius: 10px; }

    /* =========================================
       [CSS] Preview & Result Board (ACG Style)
       ========================================= */
    .board-wrap {
      width: 100%; padding: 40px; box-sizing: border-box;
      background: var(--bg-color); color: var(--font-color);
      display: flex; flex-direction: column; align-items: flex-start;
      border: 1px solid #eee; border-radius: 16px;
    }

    .acg-text {
      font-family: 'Helv', Arial, sans-serif; /* 헬베티카 폰트 적용 */
      font-weight: bold;
      letter-spacing: -0.5px;
      line-height: 1.1;
      text-transform: uppercase;
    }

    .acg-dday { font-size: 80px; margin-bottom: 24px; letter-spacing: -2px; }
    .acg-line { font-size: 32px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    
    .acg-arrow {
      display: inline-block; width: 28px; height: 28px;
    }

    /* Fixed Run Button */
    .run-btn {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 5000;
      width: min(360px, calc(100% - 40px)); height: 60px;
      background: #000; color: #fff; border: none; border-radius: 999px;
      font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      transition: transform 0.1s;
    }
    .run-btn:active { transform: translateX(-50%) scale(0.98); }

    /* Result Screen Overlay */
    .result-screen {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color); color: var(--font-color); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .result-screen.show { display: flex; }
    .screen-close {
      position: absolute; top: 20px; right: 20px; font-size: 30px; background: none; border: none; 
      color: var(--font-color); cursor: pointer; font-weight: 300; z-index: 100000; opacity: 0.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="header">
      <div class="title">ACG TRACKER</div>
    </header>

    <section class="section">
      <span class="section-label">MODE</span>
      <div class="button-group">
        <button class="toggle-btn active" id="btnRun">RUN</button>
        <button class="toggle-btn" id="btnTrail">TRAIL</button>
      </div>
    </section>

    <section class="section" id="inputSection">
      <div class="input-row">
        <div class="input-col" style="flex: 0.5;">
          <span class="input-label">D-DAY</span>
          <input type="number" id="inDday" class="big-input" value="30" placeholder="00">
        </div>
        <div class="input-col">
          <span class="input-label">DISTANCE (km)</span>
          <input type="number" id="inDist" class="big-input" value="10.56" step="0.01">
        </div>
      </div>

      <div class="input-row">
        <div class="input-col">
          <span class="input-label">TIME (H:M:S)</span>
          <div class="time-wrapper">
            <input type="number" id="inTimeH" class="big-input" value="1" placeholder="H">
            <span class="time-colon">:</span>
            <input type="number" id="inTimeM" class="big-input" value="24" placeholder="M">
            <span class="time-colon">:</span>
            <input type="number" id="inTimeS" class="big-input" value="37" placeholder="S">
          </div>
        </div>
        <div class="input-col" id="colElev" style="display: none;">
          <span class="input-label">ELEVATION (m)</span>
          <input type="number" id="inElev" class="big-input" value="215" placeholder="000">
        </div>
      </div>
    </section>

    <section class="section">
      <div class="input-row">
        <div class="input-col">
          <span class="section-label">BG COLOR</span>
          <input type="color" id="bgPicker" class="native-color-input" value="#FFFFFF">
        </div>
        <div class="input-col">
          <span class="section-label">FONT COLOR</span>
          <input type="color" id="fontPicker" class="native-color-input" value="#FF7034">
        </div>
      </div>
    </section>

    <section class="section">
      <span class="section-label">PREVIEW</span>
      <div class="board-wrap" id="previewBoard">
        <div class="acg-text acg-dday" id="pvDday">D-30</div>
        <div class="acg-text acg-line">DISTANCE &nbsp;<span id="pvDist">10.56km</span></div>
        <div class="acg-text acg-line" id="linePace">PACE &nbsp;<span id="pvPace">5'47"</span></div>
        <div class="acg-text acg-line">TIME &nbsp;<span id="pvTime">1:24:37</span></div>
        <div class="acg-text acg-line" id="lineElev" style="display: none;">
          <svg class="acg-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="6" y1="18" x2="18" y2="6"></line>
            <polyline points="6 6 18 6 18 18"></polyline>
          </svg>
          <span id="pvElev">215m</span>
        </div>
      </div>
    </section>
  </div>

  <button class="run-btn" id="btnActionRun">RUN ANIMATION</button>

  <div class="result-screen" id="resultScreen">
    <button class="screen-close" id="btnCloseResult">×</button>
    <div class="board-wrap" style="border:none; padding: 20px;" id="resultBoard">
      <div class="acg-text acg-dday" id="rvDday">D-99</div>
      <div class="acg-text acg-line">DISTANCE &nbsp;<span id="rvDist">0.00km</span></div>
      <div class="acg-text acg-line" id="rvLinePace">PACE &nbsp;<span id="rvPace">0'00"</span></div>
      <div class="acg-text acg-line">TIME &nbsp;<span id="rvTime">0:00:00</span></div>
      <div class="acg-text acg-line" id="rvLineElev" style="display: none;">
        <svg class="acg-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="18" x2="18" y2="6"></line>
          <polyline points="6 6 18 6 18 18"></polyline>
        </svg>
        <span id="rvElev">0m</span>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    
    // State
    let mode = 'RUN'; // 'RUN' or 'TRAIL'
    
    // Format helpers
    const pad = (n) => String(n).padStart(2, '0');
    function formatTime(totalSec) {
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = Math.floor(totalSec % 60);
      if (h > 0) return `${h}:${pad(m)}:${pad(s)}`;
      return `${m}:${pad(s)}`;
    }
    function formatPace(secPerKm) {
      if(!secPerKm || secPerKm === Infinity || isNaN(secPerKm)) return `0'00"`;
      const m = Math.floor(secPerKm / 60);
      const s = Math.floor(secPerKm % 60);
      return `${m}'${pad(s)}"`;
    }

    // UI Updates
    function updateUI() {
      // Inputs
      const dday = parseInt($('inDday').value) || 0;
      const dist = parseFloat($('inDist').value) || 0;
      const th = parseInt($('inTimeH').value) || 0;
      const tm = parseInt($('inTimeM').value) || 0;
      const ts = parseInt($('inTimeS').value) || 0;
      const elev = parseInt($('inElev').value) || 0;

      const totalSec = (th * 3600) + (tm * 60) + ts;
      const paceSec = dist > 0 ? (totalSec / dist) : 0;

      // Update Preview Board
      $('pvDday').innerText = `D-${dday}`;
      $('pvDist').innerText = `${dist.toFixed(2)}km`; /* 대소문자 이미지에 맞게 km */
      $('pvTime').innerText = formatTime(totalSec);
      
      if (mode === 'RUN') {
        $('linePace').style.display = 'flex';
        $('lineElev').style.display = 'none';
        $('pvPace').innerText = formatPace(paceSec);
      } else {
        $('linePace').style.display = 'none';
        $('lineElev').style.display = 'flex';
        $('pvElev').innerText = `${elev}m`;
      }
    }

    // Event Listeners
    $('btnRun').addEventListener('click', () => { 
        mode = 'RUN'; 
        $('btnRun').classList.add('active'); $('btnTrail').classList.remove('active');
        $('colElev').style.display = 'none';
        updateUI(); 
    });
    $('btnTrail').addEventListener('click', () => { 
        mode = 'TRAIL'; 
        $('btnTrail').classList.add('active'); $('btnRun').classList.remove('active');
        $('colElev').style.display = 'flex';
        updateUI(); 
    });

    ['inDday', 'inDist', 'inTimeH', 'inTimeM', 'inTimeS', 'inElev'].forEach(id => {
      $(id).addEventListener('input', updateUI);
    });

    // Color Pickers
    $('bgPicker').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--bg-color', e.target.value);
    });
    $('fontPicker').addEventListener('input', (e) => {
      document.documentElement.style.setProperty('--font-color', e.target.value);
    });

    // --- Animation Logic ---
    function animateResult() {
      const targetDday = parseInt($('inDday').value) || 0;
      const targetDist = parseFloat($('inDist').value) || 0;
      const th = parseInt($('inTimeH').value) || 0;
      const tm = parseInt($('inTimeM').value) || 0;
      const ts = parseInt($('inTimeS').value) || 0;
      const targetTimeSec = (th * 3600) + (tm * 60) + ts;
      const targetPaceSec = targetDist > 0 ? (targetTimeSec / targetDist) : 0;
      const targetElev = parseInt($('inElev').value) || 0;

      // Set initial layout for Result Board
      if (mode === 'RUN') {
        $('rvLinePace').style.display = 'flex';
        $('rvLineElev').style.display = 'none';
      } else {
        $('rvLinePace').style.display = 'none';
        $('rvLineElev').style.display = 'flex';
      }

      // Show screen
      $('resultScreen').classList.add('show');

      // Animate Loop
      const duration = 2000;
      const startTime = performance.now();
      const startDday = 99; // D-day는 무조건 99에서 시작

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3); // Cubic ease out

        // Calculate current frames
        const currentDday = Math.round(startDday - ((startDday - targetDday) * easeOut));
        const currentDist = targetDist * easeOut;
        const currentPaceSec = targetPaceSec * easeOut;
        const currentTimeSec = targetTimeSec * easeOut;
        const currentElev = Math.round(targetElev * easeOut);

        // Render frames
        $('rvDday').innerText = `D-${currentDday}`;
        $('rvDist').innerText = `${currentDist.toFixed(2)}km`;
        $('rvPace').innerText = formatPace(currentPaceSec);
        $('rvTime').innerText = formatTime(currentTimeSec);
        $('rvElev').innerText = `${currentElev}m`;

        if (progress < 1) {
          requestAnimationFrame(update);
        }
      }
      requestAnimationFrame(update);
    }

    $('btnActionRun').addEventListener('click', animateResult);
    $('btnCloseResult').addEventListener('click', () => {
      $('resultScreen').classList.remove('show');
    });

    // Init
    updateUI();
  </script>
</body>
</html>
