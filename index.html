<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Record Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Codystar&family=Fugaz+One&family=Oswald:wght@500&family=VT323&display=swap" rel="stylesheet">
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #f4f6f8;
            --text-color: #000;
            --highlight-color: #ff9500;
            --preview-bg: #ffffff;
            --preview-text: #000000;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1c2c31; /* 배경색 (스크린샷 참고) */
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            background-color: var(--bg-color);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* 버튼 그룹 공통 스타일 */
        .control-group {
            margin-bottom: 20px;
        }

        /* 스크롤 가능한 폰트 버튼 영역 */
        .scroll-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none; /* Firefox */
        }
        .scroll-row::-webkit-scrollbar {
            display: none; /* Chrome, Safari */
        }

        /* 1. 수정사항: 레이아웃/BG 컬러 버튼 한 줄 정렬 */
        .full-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        button {
            border: 2px solid #000;
            background: white;
            color: black;
            border-radius: 30px;
            padding: 10px 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        /* 버튼 꽉 차게 (Type 1, Type 2 등) */
        .btn-expand {
            flex: 1; /* 남은 공간을 균등하게 차지 */
            text-align: center;
        }

        button:hover {
            background-color: #eee;
        }

        button.active {
            background-color: #000;
            color: #fff;
        }

        /* 프리뷰 박스 */
        #preview-container {
            border: 3px solid #000;
            border-radius: 20px;
            padding: 30px;
            background-color: var(--preview-bg);
            color: var(--preview-text);
            margin-bottom: 20px;
            position: relative;
            /* 애니메이션 제거 및 고정 */
        }

        .record-item {
            margin-bottom: 20px;
        }
        .record-item:last-child {
            margin-bottom: 0;
        }

        .label {
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 2px;
            font-family: 'Helvetica Neue', Arial, sans-serif !important; /* 라벨은 기본 폰트 유지 */
        }

        .value {
            font-size: 48px;
            line-height: 1;
            font-weight: 400; /* 폰트에 따라 weight 조정 */
        }

        /* 2. 수정사항: 폰트 적용 클래스 */
        .font-anton .value { font-family: 'Anton', sans-serif; }
        .font-dots .value { font-family: 'Codystar', cursive; font-weight: 900; }
        .font-lcd .value { font-family: 'VT323', monospace; font-size: 56px; } /* LCD는 조금 더 크게 */
        .font-gothic .value { font-family: 'Oswald', sans-serif; }
        .font-speed .value { font-family: 'Fugaz One', cursive; }

        /* 사용자 입력창 (타이틀용) - 기존 빈 박스 대체 */
        .user-input {
            width: 100%;
            padding: 15px;
            border: 3px solid #000;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }

        /* RUN 버튼 */
        .run-btn {
            width: 100%;
            background-color: var(--highlight-color);
            border: none;
            color: black;
            font-size: 24px;
            font-weight: 900;
            padding: 15px;
            border-radius: 30px;
            text-transform: uppercase;
        }
        .run-btn:hover {
            opacity: 0.9;
            background-color: #e68600;
        }

        /* 결과 모달 (숨김 처리) */
        #result-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 999;
        }
        #result-img {
            max-width: 90%;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .close-btn {
            background: white;
            color: black;
            border: none;
            padding: 10px 20px;
        }

    </style>
</head>
<body>

<div class="container">
    
    <div class="control-group">
        <h3>Font</h3>
        <div class="scroll-row" id="font-controls">
            <button class="active" onclick="setFont('anton', this)">ANTON</button>
            <button onclick="setFont('dots', this)">DOTS</button>
            <button onclick="setFont('lcd', this)">LCD</button>
            <button onclick="setFont('gothic', this)">GOTHIC</button>
            <button onclick="setFont('speed', this)">SPEED</button>
        </div>
    </div>

    <div class="control-group">
        <h3>Layout</h3>
        <div class="full-row">
            <button class="btn-expand active" onclick="setLayout('type1', this)">Type 1</button>
            <button class="btn-expand" onclick="setLayout('type2', this)">Type 2</button>
        </div>
    </div>

    <div class="control-group">
        <h3>Bg Color</h3>
        <div class="full-row">
            <button class="btn-expand active" onclick="setBg('white', this)">White</button>
            <button class="btn-expand" onclick="setBg('black', this)">Black</button>
        </div>
    </div>

    <h3>Preview</h3>
    <div id="preview-container" class="font-anton">
        <div class="record-item">
            <div class="label">Distance</div>
            <div class="value">10.00Km</div>
        </div>
        <div class="record-item">
            <div class="label">Pace</div>
            <div class="value">5'30"</div>
        </div>
        <div class="record-item">
            <div class="label">Time</div>
            <div class="value">55:00</div>
        </div>
    </div>

    <input type="text" class="user-input" placeholder="Title (Optional)" id="title-input">

    <button class="run-btn" onclick="generateImage()">RUN</button>
</div>

<div id="result-modal">
    <img id="result-img" src="" alt="Result">
    <button class="close-btn" onclick="closeModal()">Close / Downloaded</button>
</div>

<script>
    const previewContainer = document.getElementById('preview-container');
    const titleInput = document.getElementById('title-input');

    // 폰트 변경 함수
    function setFont(fontName, btn) {
        // 모든 버튼 비활성화
        const buttons = btn.parentElement.querySelectorAll('button');
        buttons.forEach(b => b.classList.remove('active'));
        // 클릭된 버튼 활성화
        btn.classList.add('active');

        // 프리뷰 컨테이너의 클래스 초기화 후 새 폰트 클래스 추가
        // 기존 클래스 중 font- 로 시작하는 것 제거
        previewContainer.classList.forEach(cls => {
            if(cls.startsWith('font-')) previewContainer.classList.remove(cls);
        });
        previewContainer.classList.add('font-' + fontName);
    }

    // 레이아웃 변경 함수 (현재는 정렬만 바뀌는 예시)
    function setLayout(type, btn) {
        const buttons = btn.parentElement.querySelectorAll('button');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if(type === 'type1') {
            previewContainer.style.textAlign = 'left';
        } else {
            previewContainer.style.textAlign = 'center'; // Type 2는 가운데 정렬 예시
        }
    }

    // 배경색 변경 함수
    function setBg(color, btn) {
        const buttons = btn.parentElement.querySelectorAll('button');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if(color === 'white') {
            previewContainer.style.backgroundColor = '#ffffff';
            previewContainer.style.color = '#000000';
            previewContainer.style.borderColor = '#000000';
        } else {
            previewContainer.style.backgroundColor = '#000000';
            previewContainer.style.color = '#ffffff';
            previewContainer.style.borderColor = '#ffffff'; // 테두리도 흰색으로
        }
    }

    // RUN 버튼 클릭 시 이미지 생성
    function generateImage() {
        // html2canvas로 캡처
        html2canvas(previewContainer, {
            backgroundColor: null, // 투명 배경 방지
            scale: 2 // 고해상도
        }).then(canvas => {
            const imgData = canvas.toDataURL("image/png");
            
            // 1. 다운로드 트리거
            const link = document.createElement('a');
            link.download = 'run-record.png';
            link.href = imgData;
            link.click();

            // 2. 모달에 띄우기 (옵션)
            // document.getElementById('result-img').src = imgData;
            // document.getElementById('result-modal').style.display = 'flex';
        });
    }

    function closeModal() {
        document.getElementById('result-modal').style.display = 'none';
    }

    // 입력창에 글자 쓰면 프리뷰 어딘가에 넣고 싶다면 여기 추가 로직 작성
    // 현재는 그냥 입력창만 존재함
</script>

</body>
</html>
