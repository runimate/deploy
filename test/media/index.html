<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RUNIMATE · 사진/영상 합성 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'RMAnton';src:url('../../fonts/Anton.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'RMMarker';src:url('../../fonts/Marker.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'RMInter';src:url('../../fonts/Inter.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#0B0B0B;--panel:#161616;--line:#2A2A2A;--fg:#F4F4F0;--mute:#A8A8A2;--acc:#D7FF3A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:RMInter,-apple-system,"Apple SD Gothic Neo",sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
.wrap{max-width:520px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
header h1{font-family:RMAnton,Impact,sans-serif;font-weight:400;font-size:26px;letter-spacing:.02em;margin:0}
header span{font-family:"Space Mono",monospace;font-size:11px;color:var(--mute)}
.seg{display:flex;background:var(--panel);border-radius:12px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;color:var(--mute);font:600 14px RMInter,sans-serif;padding:10px 0;border-radius:9px;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--fg);color:#0B0B0B}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--fg);font:700 11px "Space Mono",monospace;letter-spacing:.06em;padding:0 14px;min-height:40px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#0B0B0B}
.stage{display:flex;justify-content:center;background:#050505;border-radius:16px;padding:12px;margin-bottom:8px}
canvas#view{display:block;width:auto;max-width:100%;max-height:62vh;height:auto;border-radius:6px;touch-action:none;cursor:grab;background:#000}
.hint{font-size:12px;color:var(--mute);text-align:center;margin:6px 0 14px;line-height:1.5}
.row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.btn{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px RMInter,sans-serif}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#0B0B0B}
.btn:disabled{opacity:.4}
.card{background:var(--panel);border-radius:14px;padding:14px;margin-bottom:10px}
.card h2{font:700 11px "Space Mono",monospace;letter-spacing:.12em;color:var(--mute);margin:0 0 10px}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input[type=text],input[type=date]{background:#0E0E0E;border:1px solid var(--line);border-radius:10px;color:var(--fg);font:500 16px RMInter,sans-serif;padding:10px 12px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
input[type=range]{width:100%;accent-color:var(--acc);min-height:32px}
.sw{display:flex;gap:10px}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg);outline:2px solid #0B0B0B;outline-offset:-4px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;min-height:36px}
.check input{width:20px;height:20px;accent-color:var(--acc)}
.small{font-size:12px;color:var(--mute);line-height:1.5}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal{background:var(--panel);border-radius:18px;padding:16px;width:100%;max-width:420px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal video,.modal img{width:100%;max-height:56vh;object-fit:contain;border-radius:10px;background:#000}
.spinner{width:40px;height:40px;border-radius:50%;border:3px solid #333;border-top-color:var(--acc);animation:sp 0.9s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:4px;background:#2A2A2A;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>RUNIMATE</h1><span>사진·영상 합성 테스트 · beta</span></header>

  <div class="seg" role="group" aria-label="출력 비율">
    <button type="button" data-fmt="R" aria-pressed="true">릴스 9:16</button>
    <button type="button" data-fmt="F" aria-pressed="false">피드 3:4</button>
  </div>

  <div class="chips" role="group" aria-label="레이아웃" id="layoutChips"></div>

  <div class="stage"><canvas id="view" width="1080" height="1920" aria-label="결과 미리보기. 사진이 없으면 눌러서 사진이나 영상을 넣을 수 있어요"></canvas></div>
  <p class="hint" id="hint">빈 칸을 눌러 사진이나 영상을 넣어보세요.</p>

  <div class="row">
    <button type="button" class="btn primary" id="btnPick">사진/영상 넣기</button>
    <button type="button" class="btn" id="btnReset" disabled>위치 초기화</button>
  </div>
  <input type="file" id="file" accept="image/*,video/*" class="hidden">

  <div class="card" id="zoomCard">
    <h2>크기</h2>
    <input type="range" id="zoom" min="1" max="4" step="0.01" value="1" aria-label="사진 확대">
    <p class="small">사진을 드래그하면 위치가, 두 손가락으로 벌리면 크기가 바뀌어요.</p>
  </div>

  <div class="card hidden" id="videoCard">
    <h2>영상 구간 (8초)</h2>
    <input type="range" id="trim" min="0" max="0" step="0.1" value="0" aria-label="영상 시작 지점">
    <p class="small" id="trimLabel">0.0초 ~ 8.0초</p>
    <label class="check"><input type="checkbox" id="withAudio" checked>영상 원본 소리 포함</label>
  </div>

  <div class="card">
    <h2>스타일</h2>
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <div class="sw" id="swatches" role="group" aria-label="포인트 컬러"></div>
      <div class="seg" style="margin:0;width:140px" role="group" aria-label="배경 톤">
        <button type="button" data-theme="dark" aria-pressed="true">다크</button>
        <button type="button" data-theme="light" aria-pressed="false">라이트</button>
      </div>
    </div>
    <label class="check" id="safeWrap"><input type="checkbox" id="safe" checked>릴스 세이프존 가이드 보기 (저장할 땐 안 보여요)</label>
  </div>

  <details class="card">
    <summary style="font:700 11px 'Space Mono',monospace;letter-spacing:.12em;color:var(--mute);min-height:28px">기록 입력 (테스트용)</summary>
    <div class="grid2" style="margin-top:12px">
      <label class="fld">제목<input type="text" id="inTitle" value="북한산"></label>
      <label class="fld">종류<input type="text" id="inType" value="TRAIL RUN"></label>
      <label class="fld">날짜<input type="date" id="inDate" value="2026-11-16"></label>
      <label class="fld">거리 (km)<input type="text" id="inDist" inputmode="decimal" value="21.30"></label>
      <label class="fld">페이스 (분:초)<input type="text" id="inPace" value="10:26"></label>
      <label class="fld">시간 (시:분:초)<input type="text" id="inTime" value="3:42:15"></label>
      <label class="fld">획득고도 (m)<input type="text" id="inElev" inputmode="numeric" value="1248"></label>
    </div>
  </details>

  <div class="row" style="margin-top:6px">
    <button type="button" class="btn primary" id="btnVideo">영상 저장</button>
    <button type="button" class="btn" id="btnImage">이미지 저장</button>
  </div>
  <p class="small">사진과 영상은 서버로 올라가지 않고 이 기기 안에서만 합성돼요. 영상은 15초 이하, 세로 영상을 권장해요.</p>
</div>

<div class="overlay hidden" id="busy"><div class="modal" style="align-items:center;text-align:center"><div class="spinner"></div><p id="busyText" style="margin:6px 0 0">영상 만드는 중…</p><div class="prog" style="width:100%"><i id="busyProg"></i></div></div></div>

<div class="overlay hidden" id="result"><div class="modal">
  <div id="resultMedia"></div>
  <button type="button" class="btn primary" id="btnShare">사진 앱에 저장 / 공유</button>
  <a class="btn" id="btnDownload" style="display:flex;align-items:center;justify-content:center;text-decoration:none">파일로 다운로드</a>
  <button type="button" class="btn" id="btnClose">닫기</button>
  <p class="small">아이폰은 사파리에서 "사진 앱에 저장 / 공유" → "비디오 저장(이미지 저장)"을 누르면 사진 앱에 들어가요.</p>
</div></div>

<script>
(function () {
  'use strict';
  // ---------- 상수 ----------
  var S = 3;                 // 디자인 단위(360폭) → 실제 픽셀(1080폭)
  var CLIP = 8000;           // 영상 길이 (ms)
  var HOLD = 700, COUNT = 2500;
  var FMT = {
    R: { key: 'R', W: 360, H: 640, L: 28, T: 100, BW: 286, BH: 310 },
    F: { key: 'F', W: 360, H: 480, L: 24, T: 24, BW: 312, BH: 432 }
  };
  var ACCENTS = ['#D7FF3A', '#FF6A1F', '#7FB2FF', '#E8352B', '#F4F4F0'];
  var LAYOUTS = [
    { id: 'bento', name: 'BENTO + MEDIA' },
    { id: 'panel', name: 'PANEL' },
    { id: 'tags', name: 'TAGS' },
    { id: 'knockout', name: 'KNOCKOUT' },
    { id: 'polaroid', name: 'POLAROID' }
  ];

  // ---------- 상태 ----------
  var st = { fmt: FMT.R, layout: 'bento', accent: ACCENTS[0], dark: true, safe: true };
  var media = null;               // { type, el, w, h, audio? }
  var view = { zoom: 1, px: 0, py: 0 };
  var trimStart = 0;
  var t0 = performance.now();
  var exporting = false, exportT0 = 0, hideGuides = false;

  var canvas = document.getElementById('view');
  var ctx = canvas.getContext('2d');
  var off = document.createElement('canvas');
  var octx = off.getContext('2d');

  // ---------- 유틸 ----------
  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  function ease(r) { r = clamp(r, 0, 1); return r >= 1 ? 1 : 1 - Math.pow(2, -10 * r); }
  function pop(r) { r = clamp(r, 0, 1); var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(r - 1, 3) + c1 * Math.pow(r - 1, 2); }
  function fmtPace(s) { s = Math.round(s); return Math.floor(s / 60) + "'" + String(s % 60).padStart(2, '0') + '"'; }
  function fmtTime(s) { s = Math.round(s); var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); }
  function parseClock(str) { var p = String(str).trim().split(':').map(Number); if (p.some(isNaN)) return 0; var s = 0; for (var i = 0; i < p.length; i++) s = s * 60 + p[i]; return s; }
  function lum(hex) { var n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255; return 0.2126 * r + 0.7152 * g + 0.0722 * b; }
  var ANTON = function (s) { return s + 'px RMAnton, Impact, sans-serif'; };
  var MONO = function (s, b) { return (b ? '700 ' : '400 ') + s + 'px "Space Mono", "Apple SD Gothic Neo", monospace'; };
  var MARKER = function (s) { return s + 'px RMMarker, "Apple SD Gothic Neo", cursive'; };
  var HAS_LS = 'letterSpacing' in ctx;

  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    c.beginPath(); c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }
  function text(c, s, x, y, font, color, align, ls) {
    c.font = font; c.fillStyle = color; c.textAlign = align || 'left'; c.textBaseline = 'alphabetic';
    if (HAS_LS) c.letterSpacing = (ls || 0) + 'px';
    c.fillText(s, x, y);
    if (HAS_LS) c.letterSpacing = '0px';
  }
  function measure(c, s, font, ls) {
    c.font = font; if (HAS_LS) c.letterSpacing = (ls || 0) + 'px';
    var w = c.measureText(s).width; if (HAS_LS) c.letterSpacing = '0px'; return w;
  }
  function fade(c, a, dy, fn) { c.save(); c.globalAlpha *= clamp(a, 0, 1); c.translate(0, dy || 0); fn(); c.restore(); }
  function popAt(c, s, ox, oy, rot, fn) {
    c.save(); c.translate(ox, oy); c.rotate((rot || 0) * Math.PI / 180); c.scale(Math.max(s, 0.001), Math.max(s, 0.001)); c.translate(-ox, -oy); fn(); c.restore();
  }

  // ---------- 기록 데이터 ----------
  function readData() {
    var date = document.getElementById('inDate').value || '2026-11-16';
    var dp = date.split('-');
    return {
      title: document.getElementById('inTitle').value || '',
      type: (document.getElementById('inType').value || '').toUpperCase(),
      mmdd: dp[1] + '.' + dp[2], ymd: dp[0] + '.' + dp[1] + '.' + dp[2],
      D: parseFloat(document.getElementById('inDist').value) || 0,
      P: parseClock(document.getElementById('inPace').value),
      Tm: parseClock(document.getElementById('inTime').value),
      E: parseFloat(document.getElementById('inElev').value) || 0
    };
  }
  function vals(d, k) {
    return {
      dist: (d.D * k).toFixed(2), pace: fmtPace(d.P * k), time: fmtTime(d.Tm * k),
      elev: Math.round(d.E * k).toLocaleString('en-US')
    };
  }

  // ---------- 미디어 그리기 ----------
  function coverGeom(r, extra) {
    var base = Math.max(r.w / media.w, r.h / media.h);
    var s = base * view.zoom * (extra || 1);
    var dw = media.w * s, dh = media.h * s;
    return { x: r.x + (r.w - dw) * (0.5 + view.px), y: r.y + (r.h - dh) * (0.5 + view.py), w: dw, h: dh };
  }
  function drawMedia(c, r, extra, phColor) {
    if (!media) { placeholder(c, r, phColor); return; }
    var g = coverGeom(r, media.type === 'image' ? extra : 1);
    c.drawImage(media.el, g.x, g.y, g.w, g.h);
  }
  function placeholder(c, r, color) {
    c.fillStyle = color || '#262626'; c.fillRect(r.x, r.y, r.w, r.h);
    if (exporting) return;
    var cx = r.x + r.w / 2, cy = r.y + r.h / 2;
    c.save(); c.strokeStyle = '#8A8A84'; c.lineWidth = 1.5; c.setLineDash([4, 4]);
    rr(c, r.x + 6, r.y + 6, r.w - 12, r.h - 12, 10); c.stroke(); c.restore();
    c.beginPath(); c.arc(cx, cy - 12, 16, 0, Math.PI * 2); c.fillStyle = '#F4F4F0'; c.fill();
    c.fillStyle = '#0B0B0B'; c.fillRect(cx - 7, cy - 13, 14, 2); c.fillRect(cx - 1, cy - 19, 2, 14);
    text(c, '사진/영상 추가', cx, cy + 22, '600 12px RMInter, "Apple SD Gothic Neo", sans-serif', '#F4F4F0', 'center');
  }
  function kenburns(t) { return 1 + 0.08 * clamp(t / CLIP, 0, 1); }

  // ---------- 공용 조각 ----------
  function chip(c, x, y, s, bg, fg, opt) {
    opt = opt || {};
    var font = MONO(opt.size || 9, true), padX = opt.padX || 10, h = opt.h || 22, r = opt.r === undefined ? h / 2 : opt.r;
    var w = measure(c, s, font, 1) + padX * 2;
    if (opt.alignRight) x = x - w;
    rr(c, x, y, w, h, r); c.fillStyle = bg; c.fill();
    text(c, s, x + padX, y + h / 2 + (opt.size || 9) * 0.36, font, fg, 'left', 1);
    return w;
  }
  function stat3(c, x, y, w, labels, values, vfs, color, lfs) {
    var cw = w / 3; lfs = lfs || 9;
    for (var i = 0; i < 3; i++) {
      c.save(); c.globalAlpha *= 0.75; text(c, labels[i], x + i * cw, y + lfs, MONO(lfs), color, 'left', 1); c.restore();
      text(c, values[i], x + i * cw, y + lfs + 4 + vfs * 0.8, ANTON(vfs), color);
    }
    return lfs + 4 + vfs * 0.8;
  }

  // ---------- 레이아웃 ----------
  var L = {};

  // 07 BENTO + MEDIA
  L.bento = {
    rect: function (f) { return f.key === 'R' ? { x: 0, y: 0, w: f.W, h: f.H } : { x: 24, y: 51, w: 312, h: 196 }; },
    draw: function (c, f, t, v, d, P) {
      var e0 = ease(t / 600), e1 = ease((t - 250) / 600), e2 = ease((t - 450) / 600), e3 = ease((t - 600) / 600);
      var R = f.key === 'R';
      var distTop, statTop, numSize = R ? 60 : 64;
      if (R) {
        c.fillStyle = '#0B0B0B'; c.fillRect(0, 0, f.W, f.H);
        drawMedia(c, this.rect(f), kenburns(t));
        fade(c, e0, 0, function () { chip(c, f.L, f.T, d.mmdd + ' · ' + d.type, '#0B0B0B', '#F4F4F0'); });
        statTop = 346; distTop = statTop - 8 - 97;
      } else {
        c.fillStyle = P.bg; c.fillRect(0, 0, f.W, f.H);
        var r = this.rect(f);
        fade(c, e0, (1 - e0) * 24, function () {
          c.save(); rr(c, r.x, r.y, r.w, r.h, 18); c.clip(); drawMedia(c, r, kenburns(t)); c.restore();
          chip(c, r.x + 10, r.y + 10, d.mmdd + ' · ' + d.type, '#0B0B0B', '#F4F4F0');
        });
        distTop = 255; statTop = 364;
      }
      fade(c, e1, (1 - e1) * 24, function () {
        var x = f.L, w = f.BW, h = 97 + (R ? 0 : 4), y = distTop;
        rr(c, x, y, w, h, 18); c.fillStyle = P.accent; c.fill();
        text(c, 'DISTANCE', x + 16, y + 22, MONO(9, true), '#0B0B0B', 'left', 1.3);
        text(c, v.dist, x + 16, y + h - 14, ANTON(numSize), '#0B0B0B');
        text(c, 'KM', x + w - 16, y + h - 14, ANTON(20), '#0B0B0B', 'right');
      });
      var cw = (f.BW - 16) / 3, labels = ['PACE', 'TIME', 'ELEV'], vv = [v.pace, v.time, v.elev + 'm'];
      for (var i = 0; i < 3; i++) (function (i) {
        var e = i < 2 ? e2 : e3;
        fade(c, e, (1 - e) * 24, function () {
          var x = f.L + i * (cw + 8);
          rr(c, x, statTop, cw, 64, 16); c.fillStyle = P.card; c.fill();
          c.save(); c.globalAlpha *= 0.75; text(c, labels[i], x + 12, statTop + 21, MONO(9), P.fg, 'left', 1); c.restore();
          text(c, vv[i], x + 12, statTop + 64 - 12, ANTON(R ? 22 : 24), P.fg);
        });
      })(i);
    }
  };

  // 08 PANEL
  L.panel = {
    rect: function (f) { return { x: 0, y: 0, w: f.W, h: f.H }; },
    draw: function (c, f, t, v, d, P) {
      var R = f.key === 'R';
      c.fillStyle = '#0B0B0B'; c.fillRect(0, 0, f.W, f.H);
      drawMedia(c, this.rect(f), kenburns(t));
      var oTop = ease(t / 500), p = ease((t - 200) / 700);
      fade(c, oTop, 0, function () {
        var w1 = chip(c, f.L, f.T, d.ymd, '#0B0B0B', '#F4F4F0', { size: 10, h: 24, r: 0 });
        chip(c, f.L + w1 + 6, f.T, d.title.toUpperCase(), '#F4F4F0', '#0B0B0B', { size: 10, h: 24, r: 0 });
      });
      var ink = P.accent.toUpperCase() === '#F4F4F0' || P.accent.toUpperCase() === '#D7FF3A' || P.accent.toUpperCase() === '#7FB2FF' || P.accent.toUpperCase() === '#FF6A1F' ? '#0B0B0B' : '#F4F4F0';
      var labels = ['PACE', 'TIME', 'ELEV'], vv = [v.pace, v.time, '+' + v.elev + 'M'];
      if (R) {

    var el = document.createElement(isVideo ? 'video' : 'img');
    el.src = lastUrl;
    if (isVideo) { el.controls = true; el.playsInline = true; el.setAttribute('playsinline', ''); el.loop = true; el.muted = true; el.autoplay = true; }
    else el.alt = '저장될 이미지 미리보기';
    resultMedia.appendChild(el);
    var dl = document.getElementById('btnDownload'); dl.href = lastUrl; dl.download = name;
    result.classList.remove('hidden');
  }
  document.getElementById('btnShare').addEventListener('click', async function () {
    if (!lastBlob) return;
    var file = new File([lastBlob], lastName, { type: lastBlob.type });
    try {
      if (navigator.share && (!navigator.canShare || navigator.canShare({ files: [file] }))) { await navigator.share({ files: [file], title: 'RUNIMATE' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    document.getElementById('btnDownload').click();
  });
  document.getElementById('btnClose').addEventListener('click', function () { result.classList.add('hidden'); });

  document.getElementById('btnImage').addEventListener('click', function () {
    if (!media) { alert('먼저 사진이나 영상을 넣어주세요.'); return; }
    hideGuides = true; exporting = true; render(CLIP - 1); exporting = false;
    canvas.toBlob(function (b) { hideGuides = false; if (b) showResult(b, fileStamp() + '.png', false); }, 'image/png');
  });

  document.getElementById('btnVideo').addEventListener('click', async function () {
    if (!media) { alert('먼저 사진이나 영상을 넣어주세요.'); return; }
    if (!window.MediaRecorder || !canvas.captureStream) { alert('이 브라우저는 영상 저장을 지원하지 않아요. 최신 사파리나 크롬에서 열어주세요.'); return; }
    busyText.textContent = '영상 만드는 중… 화면을 끄지 말고 8초만 기다려주세요'; busyProg.style.width = '0%';
    busy.classList.remove('hidden');
    try { await document.fonts.ready; } catch (e) {}
    hideGuides = true; exporting = true; exportT0 = 0;
    render(0);
    var stream = canvas.captureStream(30);
    var isVid = media.type === 'video';
    if (isVid && document.getElementById('withAudio').checked) {
      try {
        if (!media.audio) {
          var AC = window.AudioContext || window.webkitAudioContext; var ac = new AC();
          var src = ac.createMediaElementSource(media.el); var dest = ac.createMediaStreamDestination();
          src.connect(dest); media.audio = { ac: ac, dest: dest };
        }
        await media.audio.ac.resume();
        media.audio.dest.stream.getAudioTracks().forEach(function (tr) { stream.addTrack(tr); });
        media.el.muted = false;
      } catch (e) { console.warn('audio', e); }
    }
    if (isVid) {
      media.el.pause();
      await new Promise(function (res) { var done = false; function ok() { if (!done) { done = true; res(); } } media.el.addEventListener('seeked', ok, { once: true }); try { media.el.currentTime = trimStart; } catch (e) { ok(); } setTimeout(ok, 1500); });
      media.el.loop = true;
    }
    recMime = pickMime(); chunks = [];
    try { recorder = recMime ? new MediaRecorder(stream, { mimeType: recMime, videoBitsPerSecond: 10000000 }) : new MediaRecorder(stream); }
    catch (e) { try { recorder = new MediaRecorder(stream); recMime = ''; } catch (e2) { cleanupExport(); alert('영상 녹화를 시작할 수 없어요.'); return; } }
    recorder.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      var type = recMime || (chunks[0] && chunks[0].type) || 'video/webm';
      var blob = new Blob(chunks, { type: type.split(';')[0] });
      var ext = type.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
      cleanupExport();
      showResult(blob, fileStamp() + '.' + ext, true);
    };
    recorder.start();
    if (isVid) { try { await media.el.play(); } catch (e) {} }
    exportT0 = performance.now();
    progTimer = setInterval(function () { busyProg.style.width = clamp((performance.now() - exportT0) / CLIP * 100, 0, 100) + '%'; }, 100);
  });
  var progTimer = null, finishing = false;
  function finishExport() {
    if (finishing || !recorder) return;
    finishing = true;
    setTimeout(function () { try { recorder.stop(); } catch (e) { cleanupExport(); } }, 120);
  }
  function cleanupExport() {
    exporting = false; hideGuides = false; finishing = false; exportT0 = 0; recorder = null;
    clearInterval(progTimer);
    busy.classList.add('hidden');
    if (media && media.type === 'video') { media.el.muted = true; media.el.loop = false; }
    restartAnim();
  }

  // ---------- 시작 ----------
  Promise.all([
    document.fonts.load('40px RMAnton'), document.fonts.load('20px RMMarker'),
    document.fonts.load('400 10px "Space Mono"'), document.fonts.load('700 10px "Space Mono"')
  ]).catch(function () {}).then(function () { applyFormat(); requestAnimationFrame(loop); });
})();
</script>
</body>
