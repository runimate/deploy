<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COUNT — RUNIMATE style</title>

  <!-- Anton만 Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">

  <style>
    /* =========================
       v2.0 FONT SET (5)
       - dots/lcd/gothic/speed는 커스텀 웹폰트라고 가정
       - 폰트 파일 경로가 다르면 src만 수정
    ========================= */
    @font-face{
      font-family: "RM Dots";
      src: url("./fonts/dots.woff2") format("woff2"),
           url("./fonts/dots.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM LCD";
      src: url("./fonts/lcd.woff2") format("woff2"),
           url("./fonts/lcd.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM Gothic";
      src: url("./fonts/gothic.woff2") format("woff2"),
           url("./fonts/gothic.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM Speed";
      src: url("./fonts/speed.woff2") format("woff2"),
           url("./fonts/speed.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --bg:#000;
      --fg:#fff;
      --muted: rgba(255,255,255,.65);
      --stroke: 1px;
      --radius: 16px;
      --btn-radius: 999px;
      --pad: clamp(14px, 2.4vw, 22px);
      --gap: clamp(10px, 2vw, 14px);

      --ui-font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic";
      /* 기본 표시 폰트(2.0 느낌으로) */
      --display-font: "Anton", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--ui-font);
      overflow:hidden;
    }

    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: var(--pad);
      gap: var(--gap);
    }

    .page{
      width:min(980px, 100%);
      display:none;
      gap: var(--gap);
    }
    .page.is-active{ display:flex; flex-direction:column; }

    .card{
      border: 1px solid rgba(255,255,255,.14);
      border-radius: var(--radius);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(8px);
      padding: var(--pad);
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      align-items:center;
      justify-content:space-between;
    }
    .row .left{
      display:flex;
      gap: 10px;
      align-items:center;
      flex: 1 1 520px;
      min-width: 260px;
    }
    .row .right{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:flex-end;
      flex: 1 1 220px;
      min-width: 220px;
    }

    .label{
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"]{
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      color: var(--fg);
      outline:none;
      font-size: 16px;
      letter-spacing: .01em;
    }
    input[type="text"]::placeholder{ color: rgba(255,255,255,.35); }

    .btn{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--fg);
      padding: 11px 14px;
      border-radius: var(--btn-radius);
      cursor:pointer;
      font-size: 13px;
      letter-spacing:.02em;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
    .btn:active{ transform: translateY(1px); }

    .btn.primary{
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.22);
      font-weight: 700;
    }

    /* ---------- font buttons ---------- */
    .fontbar{
      display:flex;
      flex-wrap:wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .fontbtn{
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.9);
      padding: 9px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 12px;
      letter-spacing:.08em;
      white-space:nowrap;
      text-transform: uppercase;
    }
    .fontbtn.is-active{
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.25);
      color: #fff;
      font-weight: 800;
    }

    .stage{
      position:relative;
      height: clamp(170px, 24vw, 260px);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.02);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }

    .display{
      width:100%;
      height:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      font-family: var(--display-font);
      letter-spacing: .02em;
      line-height: 1;
      position: relative;
    }

    .display .fit{
      font-size: var(--fit-size, clamp(44px, 9.5vw, 110px));
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap: 0.02em;
      padding-bottom: 6px;
      will-change: transform;
    }

    .cell{
      position:relative;
      display:inline-flex;
      align-items:flex-end;
      justify-content:center;
      height: 1em;
      width: auto;
      overflow:hidden;
    }
    .cell.static{ overflow:visible; }

    .stack{
      position:absolute;
      left:0;
      bottom:0;
      will-change: transform;
      transform: translateY(0);
    }
    .glyph{
      height: 1em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding: 0 0.02em;
    }

    .fit{
      text-shadow:
        0 0 18px rgba(255,255,255,.10),
        0 0 40px rgba(255,255,255,.06);
    }

    .hint{
      font-size: 12px;
      color: rgba(255,255,255,.55);
      margin-top: 10px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .title{
      font-size: 12px;
      color: rgba(255,255,255,.65);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- EDIT PAGE -->
    <section id="page-edit" class="page is-active">
      <div class="card">
        <div class="label">Input</div>
        <div class="row">
          <div class="left">
            <input id="inputText" type="text" placeholder='예: 1,900 / RUNIMATE / 2026 / HELLO, 1900' autocomplete="off" />
          </div>
          <div class="right">
            <button id="btnRun" class="btn primary">RUN</button>
          </div>
        </div>

        <div class="label" style="margin-top:14px;">Font</div>
        <div class="fontbar" id="fontBar"></div>

        <div class="hint">숫자/콤마/알파벳 혼합 가능. (dots/lcd/gothic/speed는 ./fonts/에 폰트파일이 있어야 적용됨)</div>
      </div>

      <div class="card">
        <div class="label">Preview</div>
        <div class="stage">
          <div class="display" id="previewDisplay">
            <div class="fit" id="previewFit"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- RESULT PAGE -->
    <section id="page-result" class="page">
      <div class="card">
        <div class="topbar">
          <div class="title">Result</div>
          <button id="btnBack" class="btn">BACK</button>
        </div>
      </div>

      <div class="card">
        <div class="stage">
          <div class="display" id="resultDisplay">
            <div class="fit" id="resultFit"></div>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script>
    /* =========================
       CONFIG (v2.0 5 fonts)
    ========================= */
    const FONT_OPTIONS = [
      { key:"anton",  label:"ANTON",  family:`"Anton", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"dots",   label:"DOTS",   family:`"RM Dots", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"lcd",    label:"LCD",    family:`"RM LCD", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"gothic", label:"GOTHIC", family:`"RM Gothic", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"speed",  label:"SPEED",  family:`"RM Speed", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
    ];

    const DIGITS = "0123456789";
    const ALPHA_UP = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const ALPHA_LOW = "abcdefghijklmnopqrstuvwxyz";
    const STATIC_CHARS = new Set([",", ".", " ", "-", "_", "/", ":", "·"]);

    const byId = (id) => document.getElementById(id);

    const els = {
      pageEdit: byId("page-edit"),
      pageResult: byId("page-result"),
      input: byId("inputText"),
      btnRun: byId("btnRun"),
      btnBack: byId("btnBack"),
      fontBar: byId("fontBar"),
      previewFit: byId("previewFit"),
      resultFit: byId("resultFit"),
    };

    const state = {
      fontKey: "anton",
      text: "",
    };

    function renderFontButtons(){
      els.fontBar.innerHTML = "";
      FONT_OPTIONS.forEach(opt => {
        const b = document.createElement("button");
        b.className = "fontbtn" + (opt.key === state.fontKey ? " is-active" : "");
        b.textContent = opt.label;
        b.style.fontFamily = opt.family;
        b.addEventListener("click", () => {
          state.fontKey = opt.key;
          applyFont();
          renderFontButtons();
          renderPreview();
        });
        els.fontBar.appendChild(b);
      });
    }

    function applyFont(){
      const opt = FONT_OPTIONS.find(f => f.key === state.fontKey) || FONT_OPTIONS[0];
      document.documentElement.style.setProperty("--display-font", opt.family);
    }

    function fitText(containerFitEl){
      const stage = containerFitEl.closest(".stage");
      if(!stage) return;

      const minPx = 26;
      const maxPx = Math.max(44, Math.floor(stage.clientHeight * 0.62));
      let size = maxPx;

      containerFitEl.style.setProperty("--fit-size", size + "px");

      let guard = 60;
      while(guard-- > 0){
        const overflow = containerFitEl.scrollWidth > (stage.clientWidth - 24);
        if(!overflow) break;
        size -= 2;
        if(size <= minPx) { size = minPx; break; }
        containerFitEl.style.setProperty("--fit-size", size + "px");
      }
    }

    function sanitizeInput(raw){
      return (raw ?? "").replace(/\s{2,}/g, " ").trim();
    }

    function clearEl(el){ el.innerHTML = ""; }

    function buildStaticCells(text){
      const frag = document.createDocumentFragment();
      Array.from(text).forEach(ch => {
        const cell = document.createElement("span");
        cell.className = "cell static";
        const span = document.createElement("span");
        span.textContent = ch;
        span.style.position = "relative";
        span.style.padding = "0 0.02em";
        cell.appendChild(span);
        frag.appendChild(cell);
      });
      return frag;
    }

    function renderPreview(){
      const text = sanitizeInput(els.input.value || state.text || "0");
      state.text = text;

      clearEl(els.previewFit);
      els.previewFit.appendChild(buildStaticCells(text));
      requestAnimationFrame(() => fitText(els.previewFit));
    }

    function buildRollingCells(text){
      const frag = document.createDocumentFragment();
      const cells = [];
      const chars = Array.from(text);

      chars.forEach((ch, idx) => {
        if (STATIC_CHARS.has(ch)) {
          const cell = document.createElement("span");
          cell.className = "cell static";
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.position = "relative";
          span.style.padding = "0 0.02em";
          cell.appendChild(span);
          frag.appendChild(cell);
          cells.push({ type:"static", el: cell, ch });
          return;
        }

        const isDigit = DIGITS.includes(ch);
        const isUpper = ALPHA_UP.includes(ch);
        const isLower = ALPHA_LOW.includes(ch);

        if(!isDigit && !isUpper && !isLower){
          const cell = document.createElement("span");
          cell.className = "cell static";
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.position = "relative";
          span.style.padding = "0 0.02em";
          cell.appendChild(span);
          frag.appendChild(cell);
          cells.push({ type:"static", el: cell, ch });
          return;
        }

        const set = isDigit ? DIGITS : (isUpper ? ALPHA_UP : ALPHA_LOW);

        const cell = document.createElement("span");
        cell.className = "cell";

        const stack = document.createElement("div");
        stack.className = "stack";

        const loops = 2 + Math.floor(Math.random() * 4);
        const seq = [];

        for(let i=0;i<loops;i++){
          for(const s of set) seq.push(s);
        }
        for(const s of set) seq.push(s);

        seq.forEach(s => {
          const g = document.createElement("div");
          g.className = "glyph";
          g.textContent = s;
          stack.appendChild(g);
        });

        cell.appendChild(stack);
        frag.appendChild(cell);

        const targetIndexInSet = set.indexOf(ch);
        cells.push({ type:"rolling", stack, set, targetIndexInSet, idx });
      });

      return { frag, cells };
    }

    function animateToText(text){
      clearEl(els.resultFit);

      const { frag, cells } = buildRollingCells(text);
      els.resultFit.appendChild(frag);

      const start = () => {
        fitText(els.resultFit);

        const firstRolling = cells.find(c => c.type === "rolling");
        if(!firstRolling) return;

        const glyphEl = firstRolling.stack.querySelector(".glyph");
        const glyphH = glyphEl ? glyphEl.getBoundingClientRect().height : 0;

        if(!glyphH || glyphH < 1){
          requestAnimationFrame(start);
          return;
        }

        cells.forEach((c) => {
          if(c.type !== "rolling") return;

          const setLen = c.set.length;
          const totalGlyphs = c.stack.children.length;
          const lastLoopStart = totalGlyphs - setLen;
          const target = lastLoopStart + c.targetIndexInSet;

          c.stack.style.transition = "none";
          c.stack.style.transform = "translateY(0px)";

          const base = 720;
          const extra = 520 + Math.floor(Math.random()*700);
          const duration = base + extra + (c.idx * 32);
          const delay = 80 + (c.idx * 16);

          const y = -(target * glyphH);

          requestAnimationFrame(() => {
            c.stack.style.transition = `transform ${duration}ms cubic-bezier(.12,.82,.18,1) ${delay}ms`;
            c.stack.style.transform = `translateY(${y}px)`;
          });
        });
      };

      requestAnimationFrame(start);
    }

    function goto(page){
      const isEdit = page === "edit";
      els.pageEdit.classList.toggle("is-active", isEdit);
      els.pageResult.classList.toggle("is-active", !isEdit);
    }

    function run(){
      const raw = els.input.value;
      const text = sanitizeInput(raw || "0");

      const params = new URLSearchParams(location.search);
      params.set("v", text);
      params.set("font", state.fontKey);
      history.pushState({}, "", `${location.pathname}?${params.toString()}`);

      goto("result");
      applyFont();

      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => animateToText(text));
      } else {
        animateToText(text);
      }
    }

    function back(){
      const params = new URLSearchParams(location.search);
      params.delete("v");
      history.pushState({}, "", `${location.pathname}${params.toString() ? "?" + params.toString() : ""}`);
      goto("edit");
      renderPreview();
      els.input.focus();
    }

    function initFromQuery(){
      const params = new URLSearchParams(location.search);
      const qFont = params.get("font");
      const qValue = params.get("v");

      if(qFont && FONT_OPTIONS.some(f => f.key === qFont)){
        state.fontKey = qFont;
      }
      applyFont();
      renderFontButtons();

      if(qValue !== null){
        state.text = sanitizeInput(qValue);
        els.input.value = state.text;
        goto("result");

        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(() => animateToText(state.text));
        } else {
          animateToText(state.text);
        }
      } else {
        goto("edit");
        els.input.value = state.text || "";
        renderPreview();
      }
    }

    els.input.addEventListener("input", renderPreview);
    els.btnRun.addEventListener("click", run);
    els.btnBack.addEventListener("click", back);

    els.input.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        e.preventDefault();
        run();
      }
    });

    window.addEventListener("resize", () => {
      if(els.pageEdit.classList.contains("is-active")){
        fitText(els.previewFit);
      } else {
        fitText(els.resultFit);
      }
    });

    window.addEventListener("popstate", () => {
      initFromQuery();
    });

    initFromQuery();
  </script>
</body>
</html>
