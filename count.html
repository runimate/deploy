<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COUNT — RUNIMATE style</title>

  <!-- Google Fonts (사용자 선호 폰트 위주) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@400;700&family=Fugaz+One&family=Notable&family=Monoton&family=Permanent+Marker&family=Lobster&family=Rock+Salt&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --muted: rgba(255,255,255,.65);
      --stroke: 1px;
      --radius: 16px;
      --btn-radius: 999px;
      --pad: clamp(14px, 2.4vw, 22px);
      --gap: clamp(10px, 2vw, 14px);

      --ui-font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic";
      --display-font: "Orbitron", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--ui-font);
      overflow:hidden;
    }

    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: var(--pad);
      gap: var(--gap);
    }

    /* ---------- “pages” ---------- */
    .page{
      width:min(980px, 100%);
      display:none;
      gap: var(--gap);
    }
    .page.is-active{ display:flex; flex-direction:column; }

    /* ---------- card ---------- */
    .card{
      border: 1px solid rgba(255,255,255,.14);
      border-radius: var(--radius);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(8px);
      padding: var(--pad);
    }

    /* ---------- input row ---------- */
    .row{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      align-items:center;
      justify-content:space-between;
    }
    .row .left{
      display:flex;
      gap: 10px;
      align-items:center;
      flex: 1 1 520px;
      min-width: 260px;
    }
    .row .right{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:flex-end;
      flex: 1 1 220px;
      min-width: 220px;
    }

    .label{
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"]{
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      color: var(--fg);
      outline:none;
      font-size: 16px;
      letter-spacing: .01em;
    }
    input[type="text"]::placeholder{ color: rgba(255,255,255,.35); }

    .btn{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--fg);
      padding: 11px 14px;
      border-radius: var(--btn-radius);
      cursor:pointer;
      font-size: 13px;
      letter-spacing:.02em;
      user-select:none;
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
    .btn:active{ transform: translateY(1px); }

    .btn.primary{
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.22);
      font-weight: 700;
    }

    /* ---------- font buttons ---------- */
    .fontbar{
      display:flex;
      flex-wrap:wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .fontbtn{
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.9);
      padding: 9px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 12px;
      letter-spacing:.02em;
      white-space:nowrap;
    }
    .fontbtn.is-active{
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.25);
      color: #fff;
      font-weight: 700;
    }

    /* ---------- preview / result display area ---------- */
    .stage{
      position:relative;
      height: clamp(170px, 24vw, 260px);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.02);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }

    .display{
      width:100%;
      height:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      font-family: var(--display-font);
      letter-spacing: .02em;
      line-height: 1;
      position: relative;
    }

    /* 문자 전체가 width에 맞게 줄어들도록 JS에서 --fit-size로 세팅 */
    .display .fit{
      font-size: var(--fit-size, clamp(44px, 9.5vw, 110px));
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap: 0.02em;
      padding-bottom: 6px;
      will-change: transform;
    }

    /* ---------- rolling glyph columns ---------- */
    .cell{
      position:relative;
      display:inline-flex;
      align-items:flex-end;
      justify-content:center;
      height: 1em;
      width: auto;
      overflow:hidden;
    }

    .cell.static{
      overflow:visible;
    }

    .stack{
      position:absolute;
      left:0;
      bottom:0;
      will-change: transform;
      transform: translateY(0);
    }
    .glyph{
      height: 1em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding: 0 0.02em;
    }

    /* subtle glow like RUNIMATE */
    .fit{
      text-shadow:
        0 0 18px rgba(255,255,255,.10),
        0 0 40px rgba(255,255,255,.06);
    }

    .hint{
      font-size: 12px;
      color: rgba(255,255,255,.55);
      margin-top: 10px;
    }

    /* result top bar */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .title{
      font-size: 12px;
      color: rgba(255,255,255,.65);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- EDIT PAGE -->
    <section id="page-edit" class="page is-active">
      <div class="card">
        <div class="label">Input</div>
        <div class="row">
          <div class="left">
            <input id="inputText" type="text" placeholder='예: 1,900 / RUNIMATE / 2026 / HELLO, 1900' autocomplete="off" />
          </div>
          <div class="right">
            <button id="btnRun" class="btn primary">RUN</button>
          </div>
        </div>

        <div class="label" style="margin-top:14px;">Font</div>
        <div class="fontbar" id="fontBar"></div>

        <div class="hint">숫자/콤마/알파벳 혼합 가능. 길면 자동으로 크기가 줄어들어 잘리지 않게 표시돼.</div>
      </div>

      <div class="card">
        <div class="label">Preview</div>
        <div class="stage">
          <div class="display" id="previewDisplay">
            <div class="fit" id="previewFit"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- RESULT PAGE -->
    <section id="page-result" class="page">
      <div class="card">
        <div class="topbar">
          <div class="title">Result</div>
          <button id="btnBack" class="btn">BACK</button>
        </div>
      </div>

      <div class="card">
        <div class="stage">
          <div class="display" id="resultDisplay">
            <div class="fit" id="resultFit"></div>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script>
    /* =========================
       CONFIG
    ========================= */
    const FONT_OPTIONS = [
      { key:"Orbitron", label:"Orbitron", family:`"Orbitron", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"Anton", label:"Anton", family:`"Anton", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"Fugaz One", label:"Fugaz One", family:`"Fugaz One", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"Notable", label:"Notable", family:`"Notable", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"Monoton", label:"Monoton", family:`"Monoton", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"Permanent Marker", label:"Permanent Marker", family:`"Permanent Marker", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"Lobster", label:"Lobster", family:`"Lobster", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"Rock Salt", label:"Rock Salt", family:`"Rock Salt", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
    ];

    // 롤링 가능한 문자 집합 (숫자 + 알파벳)
    const DIGITS = "0123456789";
    const ALPHA_UP = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const ALPHA_LOW = "abcdefghijklmnopqrstuvwxyz";

    // 콤마/공백 등은 “정적” 표시(원하면 여기도 rolling에 포함 가능)
    const STATIC_CHARS = new Set([",", ".", " ", "-", "_", "/", ":", "·"]);

    const $ = (sel) => document.querySelector(sel);
    const byId = (id) => document.getElementById(id);

    const els = {
      pageEdit: byId("page-edit"),
      pageResult: byId("page-result"),
      input: byId("inputText"),
      btnRun: byId("btnRun"),
      btnBack: byId("btnBack"),
      fontBar: byId("fontBar"),
      previewFit: byId("previewFit"),
      resultFit: byId("resultFit"),
      previewDisplay: byId("previewDisplay"),
      resultDisplay: byId("resultDisplay"),
    };

    /* =========================
       STATE
    ========================= */
    const state = {
      fontKey: "Orbitron",
      text: "",
    };

    /* =========================
       FONT UI
    ========================= */
    function renderFontButtons(){
      els.fontBar.innerHTML = "";
      FONT_OPTIONS.forEach(opt => {
        const b = document.createElement("button");
        b.className = "fontbtn" + (opt.key === state.fontKey ? " is-active" : "");
        b.textContent = opt.label;
        b.style.fontFamily = opt.family;
        b.addEventListener("click", () => {
          state.fontKey = opt.key;
          applyFont();
          renderFontButtons();
          renderPreview();
        });
        els.fontBar.appendChild(b);
      });
    }

    function applyFont(){
      const opt = FONT_OPTIONS.find(f => f.key === state.fontKey) || FONT_OPTIONS[0];
      document.documentElement.style.setProperty("--display-font", opt.family);
    }

    /* =========================
       FIT TO WIDTH
       - previewFit / resultFit 컨테이너 width에 맞춰 폰트 크기 줄임
    ========================= */
    function fitText(containerFitEl){
      // 기본 크게 시작 -> 줄여가며 맞춤
      const stage = containerFitEl.closest(".stage");
      if(!stage) return;

      // 기준 폰트 사이즈(픽셀)
      const minPx = 26;
      const maxPx = Math.max(44, Math.floor(stage.clientHeight * 0.62));
      let size = maxPx;

      containerFitEl.style.setProperty("--fit-size", size + "px");

      // 여러 번 줄여가며 맞추기
      let guard = 60;
      while(guard-- > 0){
        // scrollWidth가 stage padding 포함 영역 넘어가면 줄임
        const overflow = containerFitEl.scrollWidth > (stage.clientWidth - 24);
        if(!overflow) break;
        size -= 2;
        if(size <= minPx) { size = minPx; break; }
        containerFitEl.style.setProperty("--fit-size", size + "px");
      }
    }

    /* =========================
       BUILD CELLS
       - preview: static render
       - result: rolling render + animate
    ========================= */
    function sanitizeInput(raw){
      // “자유 방식” 그대로 두되, 너무 긴 연속 공백은 1개로
      return (raw ?? "").replace(/\s{2,}/g, " ").trim();
    }

    function clearEl(el){ el.innerHTML = ""; }

    function renderPreview(){
      const text = sanitizeInput(els.input.value || state.text || "0");
      state.text = text;

      clearEl(els.previewFit);
      const frag = buildStaticCells(text);
      els.previewFit.appendChild(frag);

      // fit
      requestAnimationFrame(() => fitText(els.previewFit));
    }

    function buildStaticCells(text){
      const frag = document.createDocumentFragment();
      const chars = Array.from(text);

      chars.forEach(ch => {
        const cell = document.createElement("span");
        cell.className = "cell static";
        const span = document.createElement("span");
        span.textContent = ch;
        span.style.position = "relative";
        span.style.padding = "0 0.02em";
        cell.appendChild(span);
        frag.appendChild(cell);
      });

      return frag;
    }

    function buildRollingCells(text){
      const frag = document.createDocumentFragment();
      const cells = [];
      const chars = Array.from(text);

      chars.forEach((ch, idx) => {
        if (STATIC_CHARS.has(ch)) {
          const cell = document.createElement("span");
          cell.className = "cell static";
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.position = "relative";
          span.style.padding = "0 0.02em";
          cell.appendChild(span);
          frag.appendChild(cell);
          cells.push({ type:"static", el: cell, ch });
          return;
        }

        const isDigit = DIGITS.includes(ch);
        const isUpper = ALPHA_UP.includes(ch);
        const isLower = ALPHA_LOW.includes(ch);

        // 숫자/알파벳 외(예: 한글 등)는 정적으로 처리
        if(!isDigit && !isUpper && !isLower){
          const cell = document.createElement("span");
          cell.className = "cell static";
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.position = "relative";
          span.style.padding = "0 0.02em";
          cell.appendChild(span);
          frag.appendChild(cell);
          cells.push({ type:"static", el: cell, ch });
          return;
        }

        const set = isDigit ? DIGITS : (isUpper ? ALPHA_UP : ALPHA_LOW);

        // cell wrapper
        const cell = document.createElement("span");
        cell.className = "cell";
        cell.dataset.set = isDigit ? "digit" : (isUpper ? "upper" : "lower");

        // stack (여러 바퀴 + 목표문자)
        const stack = document.createElement("div");
        stack.className = "stack";

        // 최소 2~5바퀴 랜덤 + 목표 set 1회
        const loops = 2 + Math.floor(Math.random() * 4);
        const seq = [];

        for(let i=0;i<loops;i++){
          for(const s of set) seq.push(s);
        }
        for(const s of set) seq.push(s); // 마지막 한 바퀴는 “정확히” 목표로 착지하기 좋게

        // glyph nodes
        seq.forEach(s => {
          const g = document.createElement("div");
          g.className = "glyph";
          g.textContent = s;
          stack.appendChild(g);
        });

        cell.appendChild(stack);
        frag.appendChild(cell);

        const targetIndexInSet = set.indexOf(ch);
        cells.push({
          type:"rolling",
          el: cell,
          stack,
          set,
          targetIndexInSet,
          idx,
        });
      });

      return { frag, cells };
    }

    function animateToText(text){
      clearEl(els.resultFit);

      const { frag, cells } = buildRollingCells(text);
      els.resultFit.appendChild(frag);

      // fit 먼저(레이아웃 확정 후 애니메이션)
      requestAnimationFrame(() => {
        fitText(els.resultFit);

        // glyph height 계산(1em 기준) 위해 첫 rolling cell을 잡음
        const firstRolling = cells.find(c => c.type === "rolling");
        const glyphH = firstRolling
          ? firstRolling.stack.querySelector(".glyph").getBoundingClientRect().height
          : 0;

        cells.forEach((c, i) => {
          if(c.type !== "rolling") return;

          const setLen = c.set.length;
          // seq 길이 = loops*setLen + setLen (마지막 1바퀴)
          const totalGlyphs = c.stack.children.length;

          // “마지막 바퀴” 영역의 시작 인덱스
          const lastLoopStart = totalGlyphs - setLen;

          // 마지막 바퀴에서 목표로 착지
          const target = lastLoopStart + c.targetIndexInSet;

          // 시작은 맨 위(0)에서 내려가도록
          c.stack.style.transform = `translateY(0px)`;

          // duration / delay (RUNIMATE 느낌: 약간씩 어긋나게)
          const base = 700;
          const extra = 650 + Math.floor(Math.random()*600);
          const duration = base + extra + (c.idx * 35);
          const delay = 80 + (c.idx * 18);

          // easing
          c.stack.style.transition = `transform ${duration}ms cubic-bezier(.12,.82,.18,1) ${delay}ms`;

          // 이동량 = -(target * glyphH)
          const y = -(target * glyphH);

          // trigger
          requestAnimationFrame(() => {
            c.stack.style.transform = `translateY(${y}px)`;
          });
        });
      });
    }

    /* =========================
       NAV / RUN
       - “다음 페이지”는 같은 파일의 result page로 전환 + query 저장
    ========================= */
    function goto(page){
      const isEdit = page === "edit";
      els.pageEdit.classList.toggle("is-active", isEdit);
      els.pageResult.classList.toggle("is-active", !isEdit);
    }

    function run(){
      const raw = els.input.value;
      const text = sanitizeInput(raw || "0");

      // query에 저장해서 “다음 페이지”처럼 동작
      const params = new URLSearchParams(location.search);
      params.set("v", text);
      params.set("font", state.fontKey);
      history.pushState({}, "", `${location.pathname}?${params.toString()}`);

      goto("result");
      applyFont();
      animateToText(text);
    }

    function back(){
      const params = new URLSearchParams(location.search);
      params.delete("v");
      history.pushState({}, "", `${location.pathname}${params.toString() ? "?" + params.toString() : ""}`);
      goto("edit");
      renderPreview();
      els.input.focus();
    }

    /* =========================
       INIT
    ========================= */
    function initFromQuery(){
      const params = new URLSearchParams(location.search);
      const qFont = params.get("font");
      const qValue = params.get("v");

      if(qFont && FONT_OPTIONS.some(f => f.key === qFont)){
        state.fontKey = qFont;
      }
      applyFont();
      renderFontButtons();

      if(qValue !== null){
        // result mode
        state.text = sanitizeInput(qValue);
        els.input.value = state.text;
        goto("result");
        animateToText(state.text);
      } else {
        // edit mode
        goto("edit");
        els.input.value = state.text || "";
        renderPreview();
      }
    }

    // events
    els.input.addEventListener("input", renderPreview);
    els.btnRun.addEventListener("click", run);
    els.btnBack.addEventListener("click", back);

    // Enter => RUN
    els.input.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        e.preventDefault();
        run();
      }
    });

    // resize refit
    window.addEventListener("resize", () => {
      if(els.pageEdit.classList.contains("is-active")){
        fitText(els.previewFit);
      } else {
        fitText(els.resultFit);
      }
    });

    // popstate handling (뒤로가기)
    window.addEventListener("popstate", () => {
      initFromQuery();
    });

    initFromQuery();
  </script>
</body>
</html>
