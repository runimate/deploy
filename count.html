<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>COUNT — RUNIMATE v2.0</title>

  <!-- RUNIMATE v2.0 styles -->
  <link rel="stylesheet" href="./styles.css" />

  <!-- FORCE FONT LOAD (v2.0 fonts) -->
  <style>
    @font-face {
      font-family: 'Anton';
      src: url('../fonts/Anton.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Dots';
      src: url('../fonts/Dots.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'LCD';
      src: url('../fonts/LCD.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Gothic';
      src: url('../fonts/Gothic.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Speed';
      src: url('../fonts/Speed.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    .font-anton  { font-family: 'Anton', sans-serif; }
    .font-dots   { font-family: 'Dots', sans-serif; }
    .font-lcd    { font-family: 'LCD', monospace; }
    .font-gothic { font-family: 'Gothic', sans-serif; }
    .font-speed  { font-family: 'Speed', sans-serif; }

    body { background:#000; }

    .title-link,
    .title-link:link,
    .title-link:visited,
    .title-link:hover,
    .title-link:active{
      color: inherit !important;
      text-decoration: none !important;
    }

    /* COUNT preview */
    .count-preview .data-label { display:none; }
    .count-preview .data-value {
      width:100%;
      display:block;
      text-align:center;
    }

    /* RESULT rolling */
    .count-roll{
      display:flex;
      align-items:flex-end;
      justify-content:center;
      white-space:nowrap;
      line-height:1;
    }
    .count-cell{
      position:relative;
      display:inline-flex;
      align-items:flex-end;
      justify-content:center;
      height:1em;
      overflow:hidden;
    }
    .count-cell.static{
      overflow:visible;
    }
    .count-stack{
      position:absolute;
      left:0;
      bottom:0;
      will-change:transform;
    }
    .count-glyph{
      height:1em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding:0 0.02em;
    }
  </style>
</head>

<body>
  <div class="container">
    <header class="header">
      <a class="title title-link" href="./index.html">RUNIMATE <span class="version">v.2.0</span></a>
      <div class="author">by JS @runarchive.js</div>
    </header>

    <!-- INPUT -->
    <section class="section">
      <span class="section-label">COUNT</span>
      <div class="button-group wide" style="gap:10px;">
        <input
          id="countInput"
          class="field-input"
          placeholder="예: 1,900 / RUNIMATE / HELLO 1900"
          autocomplete="off"
          style="flex:1;"
        />
        <button class="toggle-btn" id="btnRunInline">RUN</button>
      </div>
    </section>

    <!-- FONT -->
    <section class="section">
      <span class="section-label">FONT</span>
      <div class="button-group font-group no-wrap" id="fontGroup">
        <button class="toggle-btn font-btn font-anton" data-font="anton">ANTON</button>
        <button class="toggle-btn font-btn font-dots" data-font="dots">DOTS</button>
        <button class="toggle-btn font-btn font-lcd" data-font="lcd">LCD</button>
        <button class="toggle-btn font-btn font-gothic" data-font="gothic">GOTHIC</button>
        <button class="toggle-btn font-btn font-speed" data-font="speed">SPEED</button>
      </div>
    </section>

    <!-- PREVIEW -->
    <section class="section">
      <span class="section-label">PREVIEW</span>
      <div class="preview type1 bg-black font-anton count-preview" id="countPreview">
        <div class="preview-content">
          <div class="data-item">
            <span class="data-value">
              <span id="pvCount">0</span>
            </span>
          </div>
        </div>
      </div>
    </section>

    <button class="run-btn" id="btnRunBottom">RUN</button>
  </div>

  <!-- RESULT -->
  <div class="screen-overlay result-screen bg-black font-anton" id="resultScreen" aria-hidden="true">
    <button class="screen-close" data-close="resultScreen">×</button>
    <div class="result-wrap type1">
      <div class="result-block" id="resultBlock"></div>
    </div>
  </div>

  <script>
    const $ = s => document.querySelector(s);

    const DIGITS = "0123456789";
    const UPPER = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    const LOWER = "abcdefghijklmnopqrstuvwxyz";
    const STATIC = new Set([",","."," ","-","_","/"]);

    const state = { font:'anton' };

    const el = {
      input: $('#countInput'),
      pv: $('#pvCount'),
      preview: $('#countPreview'),
      fontGroup: $('#fontGroup'),
      btnRunInline: $('#btnRunInline'),
      btnRunBottom: $('#btnRunBottom'),
      resultScreen: $('#resultScreen'),
      resultBlock: $('#resultBlock')
    };

    function sanitize(v){
      return String(v||'').replace(/\s+/g,' ').trim() || '0';
    }

    function applyFont(){
      el.fontGroup.querySelectorAll('[data-font]').forEach(b=>{
        b.classList.toggle('active', b.dataset.font === state.font);
      });
      const cls = `font-${state.font}`;
      [el.preview, el.resultScreen].forEach(n=>{
        n.classList.remove('font-anton','font-dots','font-lcd','font-gothic','font-speed');
        n.classList.add(cls);
      });
      renderPreview();
    }

    function renderPreview(){
      el.pv.textContent = sanitize(el.input.value);
    }

    function buildRolling(text){
      const frag = document.createDocumentFragment();
      const cells = [];

      [...text].forEach((ch,i)=>{
        if(STATIC.has(ch)){
          const s = document.createElement('span');
          s.className='count-cell static';
          s.textContent=ch;
          frag.appendChild(s);
          return;
        }

        let set = null;
        if(DIGITS.includes(ch)) set=DIGITS;
        else if(UPPER.includes(ch)) set=UPPER;
        else if(LOWER.includes(ch)) set=LOWER;
        else{
          const s=document.createElement('span');
          s.className='count-cell static';
          s.textContent=ch;
          frag.appendChild(s);
          return;
        }

        const cell=document.createElement('span');
        cell.className='count-cell';

        const stack=document.createElement('div');
        stack.className='count-stack';

        const loops=4;
        for(let l=0;l<loops;l++){
          for(const c of set){
            const g=document.createElement('div');
            g.className='count-glyph';
            g.textContent=c;
            stack.appendChild(g);
          }
        }

        cell.appendChild(stack);
        frag.appendChild(cell);

        cells.push({
          stack,
          target:set.indexOf(ch),
          setLen:set.length,
          idx:i
        });
      });

      return {frag,cells};
    }

    async function animateResult(text){
      el.resultBlock.innerHTML=`
        <div class="result-item" style="width:100%;">
          <span class="result-value" style="width:100%; text-align:center;">
            <span class="result-value-inner">
              <span id="rvCount" class="count-roll"></span>
            </span>
          </span>
        </div>
      `;

      const rvCount=$('#rvCount');
      rvCount.classList.add(`font-${state.font}`);

      const built=buildRolling(text);
      rvCount.appendChild(built.frag);

      const g=rvCount.querySelector('.count-glyph');
      if(!g) return;
      const h=g.offsetHeight;

      built.cells.forEach(c=>{
        const total=c.stack.children.length;
        const lastLoop=total-c.setLen;
        const y=-(lastLoop+c.target)*h;

        c.stack.animate(
          [
            {transform:'translateY(0)'},
            {transform:`translateY(${y}px)`}
          ],
          {
            duration:1400 + c.idx*60,
            easing:'cubic-bezier(.12,.82,.18,1)',
            fill:'forwards'
          }
        );
      });
    }

    function openResult(){
      el.resultScreen.classList.add('show');
      el.resultScreen.setAttribute('aria-hidden','false');
    }

    function run(){
      const t=sanitize(el.input.value);
      openResult();
      animateResult(t);
    }

    el.fontGroup.querySelectorAll('[data-font]').forEach(b=>{
      b.addEventListener('click',()=>{
        state.font=b.dataset.font;
        applyFont();
      });
    });

    el.input.addEventListener('input',renderPreview);
    el.input.addEventListener('keydown',e=>{
      if(e.key==='Enter'){ e.preventDefault(); run(); }
    });

    el.btnRunInline.addEventListener('click',run);
    el.btnRunBottom.addEventListener('click',run);

    applyFont();
    renderPreview();
  </script>
</body>
</html>
