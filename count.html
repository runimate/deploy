<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>COUNT — RUNIMATE style</title>

  <style>
    /* =========================
       LOCAL WEBFONTS (match your GitHub /fonts exactly)
       ./fonts/
       - Anton.woff2
       - Dots.woff2
       - LCD.woff2
       - Gothic.woff2
       - Speed.woff2
       - Inter.woff2
    ========================= */
    @font-face{
      font-family: "RM Anton";
      src: url("./fonts/Anton.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM Dots";
      src: url("./fonts/Dots.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM LCD";
      src: url("./fonts/LCD.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM Gothic";
      src: url("./fonts/Gothic.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM Speed";
      src: url("./fonts/Speed.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face{
      font-family: "RM Inter";
      src: url("./fonts/Inter.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root{
      --bg:#000;
      --fg:#fff;
      --muted: rgba(255,255,255,.65);
      --radius: 16px;
      --btn-radius: 999px;
      --pad: clamp(14px, 2.4vw, 22px);
      --gap: clamp(10px, 2vw, 14px);

      --ui-font: "RM Inter", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic";
      --display-font: "RM Anton", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }

    *{ box-sizing: border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--ui-font);
      overflow:hidden;
    }

    .wrap{
      height:100%;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: var(--pad);
      gap: var(--gap);
    }

    .page{
      width:min(980px, 100%);
      display:none;
      gap: var(--gap);
    }
    .page.is-active{ display:flex; flex-direction:column; }

    .card{
      border: 1px solid rgba(255,255,255,.14);
      border-radius: var(--radius);
      background: rgba(255,255,255,.03);
      backdrop-filter: blur(8px);
      padding: var(--pad);
    }

    .row{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      align-items:center;
      justify-content:space-between;
    }
    .row .left{
      display:flex;
      gap: 10px;
      align-items:center;
      flex: 1 1 520px;
      min-width: 260px;
    }
    .row .right{
      display:flex;
      gap: 10px;
      align-items:center;
      justify-content:flex-end;
      flex: 1 1 220px;
      min-width: 220px;
    }

    .label{
      font-size: 12px;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input[type="text"]{
      width:100%;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.35);
      color: var(--fg);
      outline:none;
      font-size: 16px;
      letter-spacing: .01em;
      font-family: var(--ui-font);
    }
    input[type="text"]::placeholder{ color: rgba(255,255,255,.35); }

    .btn{
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.06);
      color: var(--fg);
      padding: 11px 14px;
      border-radius: var(--btn-radius);
      cursor:pointer;
      font-size: 13px;
      letter-spacing:.02em;
      user-select:none;
      font-family: var(--ui-font);
    }
    .btn:hover{ background: rgba(255,255,255,.10); }
    .btn:active{ transform: translateY(1px); }
    .btn.primary{
      background: rgba(255,255,255,.16);
      border-color: rgba(255,255,255,.22);
      font-weight: 700;
    }

    .fontbar{
      display:flex;
      flex-wrap:wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .fontbtn{
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.05);
      color: rgba(255,255,255,.9);
      padding: 9px 12px;
      border-radius: 999px;
      cursor:pointer;
      font-size: 12px;
      letter-spacing:.08em;
      white-space:nowrap;
      text-transform: uppercase;
      font-family: var(--ui-font);
    }
    .fontbtn.is-active{
      background: rgba(255,255,255,.18);
      border-color: rgba(255,255,255,.25);
      color: #fff;
      font-weight: 800;
    }

    .stage{
      position:relative;
      height: clamp(170px, 24vw, 260px);
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.02);
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
    }

    .display{
      width:100%;
      height:100%;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      font-family: var(--display-font);
      letter-spacing: .02em;
      line-height: 1;
      position: relative;
    }

    .display .fit{
      font-size: var(--fit-size, clamp(44px, 9.5vw, 110px));
      display:flex;
      align-items:flex-end;
      justify-content:center;
      gap: 0.02em;
      padding-bottom: 6px;
      will-change: transform;
    }

    .cell{
      position:relative;
      display:inline-flex;
      align-items:flex-end;
      justify-content:center;
      height: 1em;
      overflow:hidden;
    }
    .cell.static{ overflow:visible; }

    .stack{
      position:absolute;
      left:0;
      bottom:0;
      transform: translateY(0);
      will-change: transform;
    }
    .glyph{
      height: 1em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding: 0 0.02em;
    }

    .fit{
      text-shadow:
        0 0 18px rgba(255,255,255,.10),
        0 0 40px rgba(255,255,255,.06);
    }

    .hint{
      font-size: 12px;
      color: rgba(255,255,255,.55);
      margin-top: 10px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 10px;
    }
    .title{
      font-size: 12px;
      color: rgba(255,255,255,.65);
      letter-spacing: .12em;
      text-transform: uppercase;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <!-- EDIT PAGE -->
    <section id="page-edit" class="page is-active">
      <div class="card">
        <div class="label">Input</div>
        <div class="row">
          <div class="left">
            <input id="inputText" type="text" placeholder='예: 1,900 / RUNIMATE / 2026 / HELLO, 1900' autocomplete="off" />
          </div>
          <div class="right">
            <button id="btnRun" class="btn primary">RUN</button>
          </div>
        </div>

        <div class="label" style="margin-top:14px;">Font</div>
        <div class="fontbar" id="fontBar"></div>

        <div class="hint">숫자/콤마/알파벳 혼합 가능. 길면 자동으로 크기가 줄어들어 잘리지 않게 표시돼.</div>
      </div>

      <div class="card">
        <div class="label">Preview</div>
        <div class="stage">
          <div class="display">
            <div class="fit" id="previewFit"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- RESULT PAGE -->
    <section id="page-result" class="page">
      <div class="card">
        <div class="topbar">
          <div class="title">Result</div>
          <button id="btnBack" class="btn">BACK</button>
        </div>
      </div>

      <div class="card">
        <div class="stage">
          <div class="display">
            <div class="fit" id="resultFit"></div>
          </div>
        </div>
      </div>
    </section>

  </div>

  <script>

       CONFIG (RUNIMATE v2.0 font keys)

      { key:"lcd",    label:"LCD",    family:`"RM LCD", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
      { key:"gothic", label:"GOTHIC", family:`"RM Gothic", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial` },
